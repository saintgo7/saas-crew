# crew.abada.kr 운영 배포 — Sprint 6 T3
# Cloudflare Tunnel → 127.0.0.1:3110 → web (Next.js)
# DB는 abada-postgres 재사용 (DATABASE_URL 환경변수)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crew-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3110:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    env_file:
      - ./.env.local
    networks:
      - crew-net
      - abada-shop_abada-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  crew-net:
    driver: bridge
  abada-shop_abada-network:
    external: true
